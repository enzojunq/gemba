# OpenShell policy for the Gemba Scenario Designer sandbox (see META_HARNESS.md section 3).
# Apply: openshell policy set --policy console/designer/openshell-policy.yaml --wait gemba-designer
# Verify the exact rule keys against `nemoclaw gemba-designer policy get` before applying.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /etc, /proc]
  read_write: [/sandbox, /tmp]          # its own workspace only; the Gemba repo is not mounted
network_policies:
  gemba_console:
    endpoints:
      - host: gemba-console.lan          # map to the Mac's LAN IP (10.1.62.59) in /etc/hosts; never localhost
        port: 8000
        protocol: rest
        enforcement: enforce
        rules:                           # only the designer endpoints; no /fork, no /inbox
          - {method: POST, path: /scenarios}
          - {method: POST, path: /runs}
          - {method: GET,  path: "/runs/**"}
          - {method: GET,  path: "/cascade/**"}
        allowed_ips: [10.0.0.0/8, 192.168.0.0/16]
    binaries: [{path: /usr/bin/curl}]
  # Crusoe inference goes through the NemoClaw managed provider (credential held by OpenShell);
  # no direct egress entry for the agent itself.
