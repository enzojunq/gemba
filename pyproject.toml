[project]
name = "gemba"
version = "0.1.0"
description = "Gemba: a decision twin for operations (floor twin + org twin)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["floor", "data", "org", "engine", "llm", "learn", "eval", "console"]
py-modules = ["contracts"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
